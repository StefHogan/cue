user:
  name: YOUR_NAME
  location: YOUR_CITY, STATE
  latitude: 0.0
  longitude: 0.0

weather:
  api_key: YOUR_OPENWEATHER_API_KEY
  units: imperial  # imperial or metric

sports_teams:
  # ESPN API. `sport` and `league` form the URL path: site.api.espn.com/.../sports/{sport}/{league}/...
  # Common league slugs: nfl, nba, mlb, nhl, mens-college-basketball, womens-college-basketball,
  # college-football, mls. `name` must contain the team's ESPN display name (e.g. "Detroit Lions").
  - name: Detroit Lions
    sport: football
    league: nfl

calendar:
  google:
    # Requires `credentials.json` (Google OAuth Desktop client) in project root.
    # First run will open a browser to consent; token saved to `token.json` for reuse.
    enabled: false
  icloud:
    # Requires an app-specific password from appleid.apple.com (NOT your main Apple ID password).
    # Reads all your iCloud calendars via CalDAV.
    enabled: false
    apple_id: you@icloud.com
    app_password: xxxx-xxxx-xxxx-xxxx

tts:
  # edge-tts neural voice. Run `edge-tts --list-voices` for the full list.
  # Good en-US options: AriaNeural, AndrewNeural, EmmaNeural, AvaNeural, BrianNeural, JennyNeural
  voice: en-US-AriaNeural
